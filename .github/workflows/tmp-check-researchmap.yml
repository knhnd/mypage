# 一時的な確認用（researchmap ブランチでのみ実行。マージ前に削除する）
name: tmp check researchmap fetch
on:
  push:
    branches: [researchmap]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fetch-researchmap.mjs
      - run: git diff --stat && node -e "const s=require('./src/data/researchmap/snapshot.json');console.log(Object.entries(s).map(([k,v])=>k+'='+v.items.length).join(' '))"
